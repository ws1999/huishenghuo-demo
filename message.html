<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息中心</title>
  <style>
    /* ============ 基础 ============
     * 原图 2.png 1206x2622（3x 屏），逻辑宽度 402px
     * 白底页面；列表行高 308dp = 102.67px；图标 103dp 垂直居中；分割线 y294 全宽 + 行间缩进线 x206 起
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(160deg, #dcd3c5, #c6bdb0);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    }
    .phone {
      width: 402px;
      height: 874px; /* 与首页总高一致，导航固定在底部 */
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 24px 60px rgba(60, 50, 30, 0.35);
      position: relative;
    }
    .strip { display: block; width: 100%; }
    /* 行与底部导航之间的弹性空白（导航固定在底部） */
    .flex-spacer { flex: 1; }
    /* tabbar 顶部横线（与首页烘焙线同位；0.33px 在 1x 屏被舍入不渲染，用 1px） */
    .tabbar-line { height: 1px; background: #e5e5e5; }

    /* ============ 消息列表 ============ */
    /* 行高实测：公告通知 308dp = 102.67px（+1px 使分割线落在整设备像素 602） */
    .row { position: relative; height: 103px; }
    /* 行顶全宽分割线（原图 y294，头部切片未含） */
    .row::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 0.33px;
      background: #e5e5e5;
    }
    /* 行间分割线：x206 起缩进（实测 rgb 229,229,229 宽 1dp） */
    .row::after {
      content: "";
      position: absolute;
      left: 68.67px; right: 0; bottom: 0;
      height: 0.33px;
      background: #e5e5e5;
    }
    .row-icon {
      position: absolute;
      top: 34px; left: 21px;
      width: 35px; height: 34.67px;
    }
    .row-title {
      position: absolute;
      top: 17.67px; left: 68.67px;
      font-size: 17px; line-height: 1;
      color: #333;
      font-family: "Heiti SC", "PingFang SC", sans-serif;
    }
    .row-desc {
      position: absolute;
      top: 48.67px; left: 68.67px;
      font-size: 14px; line-height: 1;
      color: #999;
      font-family: "Heiti SC", "PingFang SC", sans-serif;
    }
    .row-date {
      position: absolute;
      top: 19.67px; right: 30.67px;
      font-size: 14px; line-height: 1;
      color: #999;
      font-family: "Heiti SC", "PingFang SC", sans-serif;
    }

    /* ============ 行点击 ============ */
    /* 整行可点击（跳转公告详情），a 元素重置默认样式，视觉与 div 行一致 */
    a.row { display: block; color: inherit; text-decoration: none; cursor: pointer; }
    /* 按压反馈：淡灰背景（仅触碰时短暂显示） */
    a.row:active { background: rgba(0, 0, 0, 0.04); }

    /* ============ 底部导航（与首页一致） ============ */
    .tabbar { position: relative; height: 93px; background: #fff; }
    .tab-icon { position: absolute; top: 9px; width: 43.33px; height: 28.33px; }
    .tab-label {
      position: absolute; top: 36.7px;
      width: 100px; margin-left: -50px;
      text-align: center;
      font-size: 11px; color: #8C8C8C;
      font-family: "Heiti SC", "PingFang SC", sans-serif;
    }
    .tab-label.active { color: #E5B165; }
    /* 首页 tab 透明热区（覆盖图标+标签区域，点击回首页） */
    .tab-hotspot {
      position: absolute;
      left: 16.67px; top: 0;
      width: 100px; height: 93px;
      z-index: 1;
    }
    .tab-hotspot:active { background: rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body>
  <div class="phone">
    <!-- 状态栏 13:38（原图切片） -->
    <img class="strip" src="assets/b2_statusbar.png" alt="" style="height:43.33px">

    <!-- 头部：返回 + 消息中心 + 全部已读 + 分割线（原图切片） -->
    <img class="strip" src="assets/b2_header.png" alt="" style="height:54.67px">

    <!-- 公告通知（仅保留一项，整行点击进入公告详情） -->
    <a class="row" href="notice.html">
      <img class="row-icon" src="assets/b2_icon1.png" alt="">
      <div class="row-title">公告通知</div>
      <div class="row-desc">会生活商户APP功能上新</div>
      <div class="row-date">08-31</div>
    </a>

    <!-- 弹性空白：把底部导航推到页底 -->
    <div class="flex-spacer"></div>

    <!-- tabbar 顶部横线（与首页一致） -->
    <div class="tabbar-line"></div>

    <!-- 底部导航：首页 / 报表 / 我的（与首页一致，首页 active） -->
    <nav class="tabbar">
      <img class="tab-icon" style="left:45.63px" src="assets/b_tab1.png" alt="">
      <img class="tab-icon" style="left:179.34px" src="assets/b_tab2.png" alt="">
      <img class="tab-icon" style="left:314px" src="assets/b_tab3.png" alt="">
      <div class="tab-label active" style="left:66.67px">首页</div>
      <div class="tab-label" style="left:200.94px">报表</div>
      <div class="tab-label" style="left:334.7px">我的</div>
      <!-- 首页 tab 点击热区（回首页） -->
      <a class="tab-hotspot" href="index.html" aria-label="返回首页"></a>
    </nav>
  </div>
</body>
</html>
